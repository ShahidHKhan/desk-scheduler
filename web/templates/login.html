{% extends "base.html" %}
{% block title %}Sign in · Service Desk Scheduler{% endblock %}
{% block page_class %}narrow{% endblock %}
{% block content %}
<section class="card stack">
  <div>
    <h1>Sign in</h1>
    <p class="muted">Use the username and password you were given.</p>
  </div>
  {% if error %}<p class="msg error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label class="field">
      <span>Username</span>
      <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>
    <div><button class="btn primary" type="submit">Sign in</button></div>
  </form>
</section>
{% endblock %}
